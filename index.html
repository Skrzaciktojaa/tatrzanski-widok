<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tatrzański widok</title>

    <!-- CZCIONKA MARGARINE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Margarine&display=swap" rel="stylesheet">

    <style>

        /* =========================
           PODSTAWY
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            font-family: Georgia, serif;
        }


        /* =========================
           GÓRNE MENU
        ========================= */

        header {
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 8%;

            background: white;
        }


        /* LOGO */

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #7b1e16;
        }


        /* MENU */

        nav {
            display: flex;
            gap: 35px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            font-size: 16px;

            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #7b1e16;
        }


        /* =========================
           SLIDER
        ========================= */

        .hero {
            position: relative;

            width: 100%;
            height: 520px;

            overflow: hidden;
        }


        /* ZDJĘCIE */

        .hero img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           STRZAŁKI
        ========================= */

        .arrow {
            position: absolute;

            top: 50%;
            transform: translateY(-50%);

            background: transparent;
            border: none;

            color: white;

            font-size: 60px;
            font-family: Arial, sans-serif;

            cursor: pointer;

            padding: 20px;

            z-index: 2;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.7);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .arrow.left {
            left: 5px;
        }


        .arrow.right {
            right: 5px;
        }


        .arrow:hover {
            opacity: 0.7;

            transform:
                translateY(-50%)
                scale(1.08);
        }


        /* =========================
           NAPIS NA ZDJĘCIU
        ========================= */

        .hero-title {
            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: white;

            text-align: center;

            z-index: 1;

            white-space: nowrap;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.75);
        }


        /* GŁÓWNY NAPIS */

        .hero-title .title {
            font-family: "Margarine", sans-serif;

            font-size: 52px;

            font-weight: normal;

            margin-bottom: 8px;

            text-align: center;
        }


        /* NAPIS POD SPODEM */

        .hero-title .subtitle {
            font-family: "Margarine", sans-serif;

            font-size: 25px;

            font-weight: normal;

            text-align: center;
        }


        /* =========================
           TELEFONY
        ========================= */

        @media (max-width: 700px) {

            header {
                height: 70px;

                padding: 0 5%;
            }


            .logo {
                font-size: 21px;
            }


            nav {
                gap: 15px;
            }


            nav a {
                font-size: 13px;
            }


            .hero {
                height: 400px;
            }


            .hero-title .title {
                font-size: 34px;
            }


            .hero-title .subtitle {
                font-size: 19px;
            }


            .arrow {
                font-size: 45px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         GÓRNE MENU
    ========================= -->

    <header>

        <div class="logo">
            TWOJE LOGO
        </div>


        <nav>

            <a href="#">
                OKOLICA
            </a>

            <a href="#">
                KONTAKT
            </a>

        </nav>

    </header>



    <!-- =========================
         SLIDER
    ========================= -->

    <section class="hero">


        <!-- ZDJĘCIE -->

        <img
            id="heroImage"
            src="images/panorama.png"
            alt="Tatrzański widok"
        >


        <!-- LEWA STRZAŁKA -->

        <button
            class="arrow left"
            onclick="previousImage()"
            aria-label="Poprzednie zdjęcie"
        >
            ‹
        </button>


        <!-- PRAWA STRZAŁKA -->

        <button
            class="arrow right"
            onclick="nextImage()"
            aria-label="Następne zdjęcie"
        >
            ›
        </button>



        <!-- NAPIS -->

        <div class="hero-title">

            <div class="title">
                Tatrzanski widok
            </div>


            <div class="subtitle">
                Wkrotce startujemy
            </div>

        </div>


    </section>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const images = [

            "images/panorama.png",

            "images/budynek.png",

            "images/park.png"

        ];


        let currentImage = 0;


        const heroImage =
            document.getElementById("heroImage");



        /* NASTĘPNE ZDJĘCIE */

        function nextImage() {

            currentImage++;

            if (currentImage >= images.length) {

                currentImage = 0;

            }

            heroImage.src =
                images[currentImage];

        }



        /* POPRZEDNIE ZDJĘCIE */

        function previousImage() {

            currentImage--;

            if (currentImage < 0) {

                currentImage =
                    images.length - 1;

            }

            heroImage.src =
                images[currentImage];

        }

    </script>


</body>
</html>
